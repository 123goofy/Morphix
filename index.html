<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter Password</title>
  <style>
    body { background: #0a0a0a; display: flex; justify-content: center;
           align-items: center; height: 100vh; margin: 0; font-family: Arial; }
    .box { background: #1a1a2e; padding: 40px; border-radius: 12px;
           text-align: center; border: 1px solid #e94560; }
    h1 { color: #e94560; margin-bottom: 20px; }
    input { padding: 10px; width: 220px; border-radius: 6px;
            border: none; font-size: 16px; margin-bottom: 15px; }
    button { padding: 10px 30px; background: #e94560; color: white;
             border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #c73652; }
    p { color: red; display: none; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎮 Gaming Zone</h1>
    <input type="password" id="pw" placeholder="Enter password" />
    <br>
    <button onclick="checkPassword()">Enter</button>
    <p id="error">❌ Wrong password. Try again.</p>
  </div>
  <script>
    function checkPassword() {
      const input = document.getElementById('pw').value;
      if (input === 'YourPasswordHere') {
        window.location.href = 'home.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }
  </script>
</body>
</html>
